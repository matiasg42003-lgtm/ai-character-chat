<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Joker AI Chat</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <header>
        <h1>Joker AI Chat</h1>
        <p>Una conversación fuera de lo común.</p>
    </header>

    <main>

        <section id="chat">

            <div class="mensaje personaje">
                <p>¿Qué tenemos aquí... alguien quiere hablar conmigo?</p>
            </div>

            <div class="mensaje usuario">
                <p>Hola, Joker.</p>
            </div>

        </section>

        <form id="form-chat">

            <input type="text" id="mensaje-input" placeholder="Escribe un mensaje..." autocomplete="off">

            <button type="submit">Enviar</button>

        </form>

    </main>

    <footer>
        <p>Joker AI Chat</p>
    </footer>

</body>

</html>
